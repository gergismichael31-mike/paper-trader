name: paper-trader

on:
  schedule:
    # UTC times, started early because GitHub can delay scheduled runs; the script waits for the NY time itself.
    - cron: "0 13 * * 1-5"   # morning run: setups entered 09:30-12:29 NY
    - cron: "0 16 * * 1-5"   # afternoon run: setups entered 12:30-15:44 NY, then the scorecard
  workflow_dispatch:
    inputs:
      mode:
        description: "test = send a test alert; morning/afternoon = start that run now (backup if a schedule is late)"
        type: choice
        options: [test, morning, afternoon]
        default: test

permissions:
  contents: write   # to save results.csv back to the repo

concurrency:
  # a late scheduled run and a manual backup of the same run share a lane: the second waits, then finds nothing to do
  group: ${{ (github.event.schedule == '0 13 * * 1-5' || inputs.mode == 'morning') && 'morning' || (github.event.schedule == '0 16 * * 1-5' || inputs.mode == 'afternoon') && 'afternoon' || 'test' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PYTHONUNBUFFERED: "1"   # show prints in the live log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Test alert
        if: inputs.mode == 'test'
        run: python -c "import live; live.notify('Paper trader (cloud) test', 'Cloud bot is set up. Your Mac can be off now.')"

      - name: Morning scan
        if: github.event.schedule == '0 13 * * 1-5' || inputs.mode == 'morning'
        run: python live.py scan 09:30 12:29

      - name: Afternoon scan
        if: github.event.schedule == '0 16 * * 1-5' || inputs.mode == 'afternoon'
        run: python live.py scan 12:30 15:44

      - name: Already scored today?
        id: done
        if: github.event.schedule == '0 16 * * 1-5' || inputs.mode == 'afternoon'
        run: |
          git fetch -q origin main
          if [ "$(git show origin/main:last_run.txt 2>/dev/null)" = "$(date -u +%F)" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - name: Scorecard
        if: (github.event.schedule == '0 16 * * 1-5' || inputs.mode == 'afternoon') && steps.done.outputs.skip != '1'
        run: python live.py score

      - name: Save results
        if: (github.event.schedule == '0 16 * * 1-5' || inputs.mode == 'afternoon') && steps.done.outputs.skip != '1'
        run: |
          date -u +%F > last_run.txt   # a daily commit also keeps GitHub from pausing the schedule
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results.csv last_run.txt 2>/dev/null || git add last_run.txt
          git commit -m "Scorecard $(date -u +%F)" || exit 0
          git pull -q --rebase origin main && git push
