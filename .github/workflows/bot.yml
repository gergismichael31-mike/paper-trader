name: paper-trader

on:
  schedule:
    # UTC times, started early because GitHub can delay scheduled runs; the script waits for the NY time itself.
    # GitHub sometimes drops scheduled runs, so each run gets 6 chances; extra starts find the work
    # done (same concurrency lane, scorecard already saved) and exit without doing anything.
    - cron: "5,25,45 12,13 * * 1-5"   # morning run: setups entered 09:30-12:29 NY
    - cron: "5,25,45 15,16 * * 1-5"   # afternoon run: setups entered 12:30-15:44 NY, then the scorecard
  workflow_dispatch:
    inputs:
      mode:
        description: "test = send a test alert; morning/afternoon = start that run now; relay = keep the daily starts going"
        type: choice
        options: [test, morning, afternoon, relay]
        default: test

permissions:
  contents: write   # to save results.csv back to the repo
  actions: write    # relay starts the next runs itself

concurrency:
  # a late scheduled run and a manual backup of the same run share a lane: the second waits, then finds nothing to do
  group: ${{ (github.event.schedule == '5,25,45 12,13 * * 1-5' || inputs.mode == 'morning') && 'morning' || (github.event.schedule == '5,25,45 15,16 * * 1-5' || inputs.mode == 'afternoon') && 'afternoon' || inputs.mode == 'relay' && 'relay' || 'test' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      ALPACA_KEY: ${{ secrets.ALPACA_KEY }}       # Alpaca PAPER keys: enable the Approve button
      ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      PYTHONUNBUFFERED: "1"   # show prints in the live log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Test alert
        if: inputs.mode == 'test'
        run: |
          python - <<'PY'
          import live
          if live.trading:  # read-only check: no order is placed
              live.paper_only()  # raises (and alerts) if this is not an Alpaca PAPER account
              a = live.trading.get_account()
              msg = f"PAPER account {a.account_number} verified, equity ${float(a.equity):,.2f}. Approve buttons are live."
              from alpaca.trading.requests import GetOrdersRequest
              from alpaca.trading.enums import QueryOrderStatus
              for o in live.trading.get_orders(GetOrdersRequest(status=QueryOrderStatus.ALL, limit=5, nested=True)):
                  legs = ", ".join(f"{g.type.value} {g.status.value}" for g in (o.legs or []))
                  msg += f"\n{o.submitted_at:%m-%d %H:%M}Z {o.side.value} {o.qty} {o.symbol}: {o.status.value} @ {o.filled_avg_price} [{legs}]"
              for p in live.trading.get_all_positions():
                  msg += f"\nOPEN {p.qty} {p.symbol} avg {p.avg_entry_price}, now {p.current_price}, P&L ${float(p.unrealized_pl):,.2f}"
          else:
              msg = "Cloud bot is set up (alert-only: no Alpaca keys found)."
          print(msg)
          live.notify("Paper trader (cloud) test", msg)
          PY

      - name: Relay
        # GitHub skipped every cron on 2026-11-24, so runs also start themselves: each relay waits (max 5h)
        # for the next 09:10 / 12:10 NY weekday start, dispatches that run, then dispatches the next relay.
        if: inputs.mode == 'relay'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess, time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          NY = ZoneInfo("America/New_York")
          now = datetime.now(NY)
          starts = [datetime.combine(now.date() + timedelta(days=i), datetime.strptime(hm, "%H:%M").time(), NY)
                    for i in range(8) for hm in ("09:10", "12:10")]
          t = min(x for x in starts if x > now and x.weekday() < 5)
          mode = "morning" if t.hour == 9 else "afternoon"
          run = lambda m: subprocess.run(["gh", "workflow", "run", "bot.yml", "-f", f"mode={m}"], check=True)
          if (t - now).total_seconds() <= 5 * 3600:
              print("waiting for", t, mode)
              time.sleep((t - now).total_seconds())
              run(mode)
          else:
              print("next start", t, "is over 5h away, handing off")
          run("relay")
          PY

      - name: Morning scan
        if: github.event.schedule == '5,25,45 12,13 * * 1-5' || inputs.mode == 'morning'
        run: python live.py scan 09:30 12:29

      - name: Afternoon scan
        if: github.event.schedule == '5,25,45 15,16 * * 1-5' || inputs.mode == 'afternoon'
        run: python live.py scan 12:30 15:44

      - name: Already scored today?
        id: done
        if: github.event.schedule == '5,25,45 15,16 * * 1-5' || inputs.mode == 'afternoon'
        run: |
          git fetch -q origin main
          if [ "$(git show origin/main:last_run.txt 2>/dev/null)" = "$(date -u +%F)" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - name: Scorecard
        if: (github.event.schedule == '5,25,45 15,16 * * 1-5' || inputs.mode == 'afternoon') && steps.done.outputs.skip != '1'
        run: python live.py score

      - name: Save results
        if: (github.event.schedule == '5,25,45 15,16 * * 1-5' || inputs.mode == 'afternoon') && steps.done.outputs.skip != '1'
        run: |
          date -u +%F > last_run.txt   # a daily commit also keeps GitHub from pausing the schedule
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add results.csv last_run.txt 2>/dev/null || git add last_run.txt
          git commit -m "Scorecard $(date -u +%F)" || exit 0
          git pull -q --rebase origin main && git push
